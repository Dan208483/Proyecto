<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDCE</title>
    <!-- Favicon personalizado -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F17',
                        glass: 'rgba(23, 30, 46, 0.7)',
                        glassborder: 'rgba(255, 255, 255, 0.08)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0b0f17 50%, #020617 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(23, 30, 46, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .calendar-day-active {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen pb-12">

    <!-- Header / Barra Superior -->
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-lg shadow-lg shadow-indigo-500/10">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Agenda & Estudio Pro</h1>
                    <p class="text-xs text-slate-400">Planificador diario con porcentaje de avance</p>
                </div>
            </div>

            <!-- Navegación de Pestañas -->
            <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button id="tab-btn-agenda" onclick="cambiarPestana('agenda')" class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 bg-indigo-600 text-white shadow-md">
                    <i class="fa-solid fa-calendar-days"></i> Calendario & Tareas
                </button>
                <button id="tab-btn-estudio" onclick="cambiarPestana('estudio')" class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-graduation-cap"></i> Centro de Estudio
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-6">

        <!-- PESTAÑA 1: CALENDARIO & TAREAS -->
        <section id="pestana-agenda" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Columna Izquierda: Calendario Mensual -->
            <div class="lg:col-span-5 space-y-6">
                <div class="glass-card rounded-2xl p-5 shadow-2xl">
                    <div class="flex items-center justify-between mb-4">
                        <h2 id="mes-año-header" class="text-lg font-bold text-white capitalize"></h2>
                        <div class="flex items-center gap-2">
                            <button onclick="cambiarMes(-1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
                                <i class="fa-solid fa-chevron-left text-xs"></i>
                            </button>
                            <button onclick="irHoy()" class="px-3 py-1 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 text-xs rounded-lg border border-indigo-500/30 transition">
                                Hoy
                            </button>
                            <button onclick="cambiarMes(1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Días de la semana -->
                    <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs font-semibold text-slate-400">
                        <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb
